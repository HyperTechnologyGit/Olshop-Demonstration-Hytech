<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — Samudra</title><link rel="stylesheet" href="admin.css"></head><body>
<div id="adminLogin" class="admin-login-screen" style="display:grid"><div class="admin-login-orb a"></div><div class="admin-login-orb b"></div><form id="adminLoginForm" class="admin-login-card"><a href="index.html" class="admin-back">← Kembali ke Marketplace</a><div class="admin-logo">S</div><div class="admin-eyebrow">SAMUDRA / ADMIN ONLY</div><h1>Admin Login</h1><p>Halaman khusus pengelola marketplace Samudra.</p><label>Username / Email<input id="adminUsername" required placeholder="admin@samudra.local"></label><label>Password<input id="adminPassword" type="password" required placeholder="••••••••"></label><button type="submit" class="admin-login-btn">Masuk sebagai Admin →</button><p id="adminLoginError" class="admin-login-error"></p><div class="admin-demo">Demo: <b>admin@samudra.local</b> / <b>samudra123</b></div></form></div>
<div id="adminConsole" class="admin-app" hidden style="display:none"><aside class="sidebar"><div class="side-brand"><div class="brand-mark small">S</div><div><b>SAMUDRA</b><small>ADMIN CONSOLE</small></div></div><nav class="side-nav"><div class="nav-label">MAIN</div><button class="nav-item active" data-page="dashboard"><span>⌂</span> Dashboard</button><button class="nav-item" data-page="orders"><span>▤</span> Pesanan</button><button class="nav-item" data-page="products"><span>□</span> Semua Produk</button><button class="nav-item" data-page="sellers"><span>♙</span> Seller</button><button class="nav-item" data-page="users"><span>♟</span> User</button><div class="nav-label">MANAGEMENT</div><button class="nav-item" data-page="categories"><span>◈</span> Kategori</button><button class="nav-item" data-page="reports"><span>◒</span> Laporan</button><button class="nav-item" data-page="settings"><span>⚙</span> Pengaturan</button></nav><div class="sidebar-bottom"><a class="back-store" href="index.html">← Kembali ke Store</a><button class="logout-side" id="logoutBtn">↪ Keluar</button></div></aside><main class="main-content"><header class="topbar"><div><button class="mobile-menu" id="mobileMenu">☰</button><span class="top-kicker">SAMUDRA / CONTROL CENTER</span><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="icon-btn" id="refreshAdmin">↻</button><div class="admin-profile"><div class="avatar">A</div><div><b id="adminName">Administrator</b><small>Super Admin</small></div></div></div></header><section id="adminContent" class="admin-content"></section></main></div>
<script>
(function(){const KEY='samudra_admin_session';const login=document.getElementById('adminLogin'),console=document.getElementById('adminConsole');function valid(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.role==='admin'}catch(e){return false}}function open(){login.hidden=true;login.style.display='none';console.hidden=false;console.style.display='flex';window.initModernAdmin&&window.initModernAdmin()}if(valid())open();document.getElementById('adminLoginForm').onsubmit=function(e){e.preventDefault();const u=document.getElementById('adminUsername').value.trim().toLowerCase(),p=document.getElementById('adminPassword').value;if((u==='admin'||u==='admin@samudra.local')&&p==='samudra123'){localStorage.setItem(KEY,JSON.stringify({id:'ADM-1',email:'admin@samudra.local',name:'Administrator',role:'admin',loginAt:Date.now()}));open()}else document.getElementById('adminLoginError').textContent='Username atau password admin salah.'};document.getElementById('logoutBtn').onclick=function(){localStorage.removeItem(KEY);console.hidden=true;console.style.display='none';login.hidden=false;login.style.display='grid'};})();
</script><script src="admin.js"></script></body></html>
